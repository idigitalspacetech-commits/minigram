<svg width="200" height="200" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">

  <!-- Gold accent screen (back, offset right) -->
  <rect x="30" y="12" width="28" height="38" rx="5" fill="#F4A733" opacity="0.25"/>
  <rect x="30" y="12" width="28" height="38" rx="5" fill="none" stroke="#F4A733" stroke-width="1.5" opacity="0.6"/>

  <!-- Mid screen -->
  <rect x="21" y="18" width="30" height="40" rx="5" fill="rgba(34,158,217,0.15)"/>
  <rect x="21" y="18" width="30" height="40" rx="5" fill="none" stroke="#229ED9" stroke-width="1" opacity="0.6"/>

  <!-- Front screen -->
  <rect x="13" y="24" width="30" height="40" rx="6" fill="#1a2130"/>
  <rect x="13" y="24" width="30" height="40" rx="6" fill="none" stroke="#229ED9" stroke-width="1.5"/>

  <!-- Blue app bar -->
  <rect x="13" y="24" width="30" height="9" rx="6" fill="#229ED9"/>
  <rect x="13" y="29" width="30" height="4" fill="#229ED9"/>
  <circle cx="19" cy="28.5" r="1.8" fill="white" opacity="0.7"/>

  <!-- Content lines -->
  <rect x="18" y="39" width="20" height="2.5" rx="1.25" fill="rgba(255,255,255,0.4)"/>
  <rect x="18" y="44" width="14" height="2.5" rx="1.25" fill="rgba(255,255,255,0.4)" opacity="0.6"/>
  <rect x="18" y="49" width="17" height="2.5" rx="1.25" fill="rgba(255,255,255,0.4)" opacity="0.4"/>

  <!-- Gold CTA button -->
  <rect x="18" y="55" width="20" height="6" rx="3" fill="#F4A733"/>
  <line x1="22" y1="58" x2="34" y2="58" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Home bar -->
  <rect x="24" y="61" width="8" height="1.5" rx="0.75" fill="rgba(255,255,255,0.3)"/>

</svg>
